<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hii | Hybrid Intelligence Institute</title>
  <meta name="description" content="Hii helps people navigate a historic transition without losing themselves or one another." />
  <meta name="theme-color" content="#000000" />
  <link rel="stylesheet" href="/css/hii-interface.css" />
</head>
<body class="hii-interface-home">
  <a class="sr-only" href="#hii-interface">Skip to Hii interface</a>
  <main id="hii-interface">
    <section class="motion-hero" aria-label="Hii interactive observatory" data-motion-hero>
      <div class="motion-hero__stage">
        <video class="motion-hero__video" data-motion-video muted playsinline preload="auto" aria-label="Hii observatory interface opening animation"></video>
        <nav class="hero-hit-map" data-hero-map aria-label="Choose a Hii pathway">
          <a class="hero-node hero-node--relate" data-hero-node href="/relationships/" tabindex="-1" aria-label="Relate: Human-AI Relationships"><span class="sr-only">Relate: Human-AI Relationships</span></a>
          <a class="hero-node hero-node--adapt" data-hero-node href="/adaptation/" tabindex="-1" aria-label="Adapt: Human Adaptation"><span class="sr-only">Adapt: Human Adaptation</span></a>
          <a class="hero-node hero-node--care" data-hero-node href="/mental-health/" tabindex="-1" aria-label="Care: Mental Health and Clinical Practice"><span class="sr-only">Care: Mental Health and Clinical Practice</span></a>
          <a class="hero-node hero-node--prepare" data-hero-node href="/institutional-readiness/" tabindex="-1" aria-label="Prepare: Institutional Readiness"><span class="sr-only">Prepare: Institutional Readiness</span></a>
          <a class="hero-node hero-node--govern" data-hero-node href="/governance/" tabindex="-1" aria-label="Govern: Governance Translation"><span class="sr-only">Govern: Governance Translation</span></a>
          <a class="hero-node hero-node--understand" data-hero-node href="/understand/" tabindex="-1" aria-label="Understand: Public Orientation and Literacy"><span class="sr-only">Understand: Public Orientation and Literacy</span></a>
          <a class="hero-node hero-node--study" data-hero-node href="/research/" tabindex="-1" aria-label="Study: Research, Evidence, and Publications"><span class="sr-only">Study: Research, Evidence, and Publications</span></a>
          <button class="hero-node hero-node--film" data-hero-node data-open-film type="button" tabindex="-1" aria-label="Play the Hii film"><span class="sr-only">Play the Hii film</span></button>
        </nav>
        <p class="motion-hero__hint" data-hero-hint aria-live="polite">The observatory is opening.</p>
      </div>
    </section>
  </main>
  <div class="film-dialog" data-film-dialog hidden>
    <div class="film-dialog__backdrop" data-close-film></div>
    <section class="film-dialog__panel" role="dialog" aria-modal="true" aria-label="Hii film">
      <button class="film-dialog__close" type="button" data-close-film aria-label="Close Hii film">Return to Hii</button>
      <video class="film-dialog__video" data-film-video controls playsinline preload="metadata" poster="/hii-film-poster.jpg">
        <source src="/hii-film-1080p.mp4" type="video/mp4" media="(min-width: 900px)" />
        <source src="/hii-film-720p.mp4" type="video/mp4" />
      </video>
    </section>
  </div>
  <script src="/js/hii-hero.js"></script>
</body>
</html>
