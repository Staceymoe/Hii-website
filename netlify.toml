[build]
  command = "bash scripts/build-hii-front-door-restart.sh && pnpm build"
  publish = "_site"

[[redirects]]
  from = "/roundtable"
  to = "/mental-health/roundtable/"
  status = 301

[[redirects]]
  from = "/roundtable/"
  to = "/mental-health/roundtable/"
  status = 301

[[redirects]]
  from = "/care"
  to = "/mental-health/"
  status = 301

[[redirects]]
  from = "/care/"
  to = "/mental-health/"
  status = 301

[[redirects]]
  from = "/relate"
  to = "/relationships/"
  status = 301

[[redirects]]
  from = "/relate/"
  to = "/relationships/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/documents/relationship-unit-working-paper-v0.3.pdf"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'"
