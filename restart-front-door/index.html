<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Hii | Hybrid Intelligence Institute</title>
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Hii is the Hybrid Intelligence Institute. We study the human side of living alongside AI systems." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/front-door.css" />
</head>
<body>
  <main class="hii-entry" data-hii-entry>
    <section class="hero-shell" aria-label="Hii observatory entrance">
      <div class="hero-stage" data-hero-stage>
        <video
          class="hero-motion"
          data-hero-motion
          muted
          playsinline
          preload="auto"
          aria-label="Hii observatory animation"
        >
          <source src="/media/hii-hero-front-door-approved.mp4" type="video/mp4" />
        </video>

        <div class="lens-map" data-lens-map aria-label="Hii destinations">
          <button class="lens lens-film" type="button" data-destination="film" aria-label="Open Hii Film"></button>
          <button class="lens lens-relate" type="button" data-destination="Relate" aria-label="Open Relate"></button>
          <button class="lens lens-adapt" type="button" data-destination="Adapt" aria-label="Open Adapt"></button>
          <button class="lens lens-care" type="button" data-destination="Care" aria-label="Open Care"></button>
          <button class="lens lens-prepare" type="button" data-destination="Prepare" aria-label="Open Prepare"></button>
          <button class="lens lens-govern" type="button" data-destination="Govern" aria-label="Open Govern"></button>
          <button class="lens lens-understand" type="button" data-destination="Understand" aria-label="Open Understand"></button>
          <button class="lens lens-study" type="button" data-destination="Study" aria-label="Open Study"></button>
        </div>
      </div>

      <button class="autoplay-fallback" type="button" data-autoplay-fallback hidden>Enter Hii</button>
    </section>

    <section class="destination-test" data-destination-test hidden aria-live="polite">
      <button class="return-hii" type="button" data-return-hii>Return to Hii</button>
      <p class="destination-title" data-destination-title></p>
    </section>

    <section class="film-layer" data-film-layer hidden aria-label="Hii Film">
      <button class="return-hii film-return" type="button" data-return-hii>Return to Hii</button>
      <video class="hii-film" data-hii-film controls playsinline preload="metadata">
        <source src="/media/hii-film-approved-web-1080p.mp4" type="video/mp4" />
      </video>
    </section>
  </main>

  <script src="/front-door.js"></script>
</body>
</html>
