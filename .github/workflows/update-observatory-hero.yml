name: Update Observatory Hero

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-observatory-hero.yml'

permissions:
  contents: write

jobs:
  update-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Check out observatory hero branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the approved Hii website hero from Google Drive
        run: |
          python -m pip install --upgrade gdown
          mkdir -p assets
          gdown 'https://drive.google.com/uc?id=1J8wAx9uPCNKMMZ72RbqXJL87u1-67xvY' -O assets/hii-observatory-hero.mp4
          test -s assets/hii-observatory-hero.mp4

      - name: Verify the downloaded video
        run: |
          file assets/hii-observatory-hero.mp4
          test $(stat -c%s assets/hii-observatory-hero.mp4) -gt 1000000

      - name: Commit the approved hero video
        run: |
          git config user.name 'Hii Website Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/hii-observatory-hero.mp4
          git diff --cached --quiet && exit 0
          git commit -m 'Replace observatory hero with approved animation'
          git push
