name: Temporary Netlify Post-Hero Preview Deploy

on:
  push:
    branches:
      - agent/netlify-preview-deploy-20260806
  pull_request:
    branches:
      - agent/post-hero-site-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify the draft build
        run: |
          npm run build
          npm run check

