name: Temporary Netlify Draft Preview Deploy

on:
  pull_request:
    branches:
      - agent/post-hero-site-build

permissions:
  contents: read

jobs:
  deploy-preview:
    if: github.event.pull_request.number == 4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out preview merge
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify draft build
        run: |
          npm run build
          npm run check

      - name: Deploy to isolated Netlify preview project
