name: Publish Observatory Draft Asset

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-observatory-draft.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out observatory draft branch
        uses: actions/checkout@v4
        with:
          ref: agent/observatory-hero-draft
          fetch-depth: 0

      - name: Download approved Hii website hero
        run: |
          python -m pip install --upgrade gdown
          mkdir -p assets
          gdown 'https://drive.google.com/uc?id=1J8wAx9uPCNKMMZ72RbqXJL87u1-67xvY' -O assets/hii-observatory-hero.mp4
          test -s assets/hii-observatory-hero.mp4
          test $(stat -c%s assets/hii-observatory-hero.mp4) -gt 1000000

      - name: Commit approved asset to draft branch
        run: |
          git config user.name 'Hii Website Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/hii-observatory-hero.mp4
          git diff --cached --quiet && exit 0
          git commit -m 'Replace observatory hero with approved animation'
          git push origin HEAD:agent/observatory-hero-draft
